extends: ["spectral:oas"]

# `oas3-unused-component` flags schemas that have no $ref pointing at them.
# We intentionally keep some documentation-only schemas (IDTokenClaims,
# JWTAccessTokenClaims, JWTIntrospectionResponse, UserInfoSignedResponse)
# that describe the decoded payload of values that travel as opaque JWT
# strings on the wire — they cannot be $ref'd from any operation but their
# documentation value justifies their inclusion. We downgrade the rule to
# `hint` so it stays visible (not silenced) while not failing the lint.
rules:
  oas3-unused-component: hint
