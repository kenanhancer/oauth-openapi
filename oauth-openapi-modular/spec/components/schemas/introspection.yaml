IntrospectionRequest:
  allOf:
  - $ref: token-requests.yaml#/ClientAuthFields
  - type: object
    required:
    - token
    properties:
      token:
        type: string
        description: The token to introspect (access or refresh token).
      token_type_hint:
        type: string
        description: |
          Hint to the AS about the type of token being introspected.
          Values come from the IANA OAuth Token Type Hint registry
          (RFC 7009 §4.1.2); the schema is kept open rather than a
          closed enum so future registrations work without spec churn.
        examples:
        - access_token
        - refresh_token
IntrospectionResponse:
  description: |
    RFC 7662 §2.2. Always returned with HTTP 200, even for inactive
    tokens (then only `{"active": false}` is included). Open to
    registered extension members per §2.2 — `cnf` (RFC 7800), DPoP
    binding (RFC 9449), `authorization_details` (RFC 9396 §9), etc.
  type: object
  required:
  - active
  additionalProperties: true
  properties:
    active:
      type: boolean
      description: |
        REQUIRED. Whether the token is currently valid. If `false`, all
        other fields MAY be omitted.
    scope:
      type: string
    client_id:
      type: string
    username:
      type: string
    token_type:
      type: string
      description: Typically `Bearer` (RFC 6750) or `DPoP` (RFC 9449).
    exp:
      $ref: jose.yaml#/NumericDate
      description: Expiration time (seconds since 1970-01-01T00:00:00Z).
    iat:
      $ref: jose.yaml#/NumericDate
      description: Issued at (seconds since 1970-01-01T00:00:00Z).
    nbf:
      $ref: jose.yaml#/NumericDate
    sub:
      type: string
    aud:
      oneOf:
      - $ref: jose.yaml#/StringOrURI
      - type: array
        items:
          $ref: jose.yaml#/StringOrURI
    iss:
      $ref: jose.yaml#/StringOrURI
    jti:
      type: string
    acr:
      type: string
      description: Authentication Context Class Reference (RFC 9470 §6.2).
    auth_time:
      $ref: jose.yaml#/NumericDate
      description: End-user authentication time (RFC 9470 §6.2).
    cnf:
      $ref: claims.yaml#/Confirmation
      description: |
        Confirmation method (RFC 7800) — present for sender-constrained
        tokens (DPoP `cnf.jkt` per RFC 9449 §6.1, mTLS `cnf.x5t#S256`
        per RFC 8705 §3.2).
    authorization_details:
      type: array
      description: 'RAR (RFC 9396 §9): granted authorization details for this token.'
      items:
        $ref: rar.yaml#/AuthorizationDetail
JWTIntrospectionResponse:
  description: |
    Decoded payload of a JWT introspection response (RFC 9701 §5). Wire
    form is a signed (optionally encrypted) JWT with media type and `typ`
    header `token-introspection+jwt`, returned by `/introspect` when the
    caller requests it via `Accept`. The RFC 7662 members are nested under
    the `token_introspection` claim (NOT flattened to top level).
  type: object
  required:
  - iss
  - aud
  - iat
  - token_introspection
  additionalProperties: true
  properties:
    iss:
      $ref: jose.yaml#/StringOrURI
      description: REQUIRED. Issuer (the authorization server).
    aud:
      description: REQUIRED. Audience — the protected resource that introspected.
      oneOf:
      - $ref: jose.yaml#/StringOrURI
      - type: array
        items:
          $ref: jose.yaml#/StringOrURI
    iat:
      $ref: jose.yaml#/NumericDate
      description: REQUIRED. Issued-at time.
    token_introspection:
      $ref: introspection.yaml#/IntrospectionResponse
      description: REQUIRED. RFC 7662 members wrapped as one claim (RFC 9701 §5).
RevocationRequest:
  allOf:
  - $ref: token-requests.yaml#/ClientAuthFields
  - type: object
    required:
    - token
    properties:
      token:
        type: string
        description: The token (access or refresh) to revoke.
      token_type_hint:
        type: string
        description: |
          Hint to the AS about the token type. Open per IANA OAuth
          Token Type Hint registry (RFC 7009 §4.1.2).
        examples:
        - access_token
        - refresh_token
