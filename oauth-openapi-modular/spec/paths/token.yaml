post:
  tags:
  - Core
  operationId: token
  summary: Token endpoint (all grants)
  description: |
    Issues access tokens. The `grant_type` form field selects the grant. All
    grants supported by OAuth 2.1 are modeled here:

    - `authorization_code` — RFC 6749 §4.1.3 (with PKCE per RFC 7636)
    - `client_credentials` — RFC 6749 §4.4
    - `refresh_token` — RFC 6749 §6
    - `urn:ietf:params:oauth:grant-type:device_code` — RFC 8628 §3.4
    - `urn:ietf:params:oauth:grant-type:jwt-bearer` — RFC 7523
    - `urn:ietf:params:oauth:grant-type:token-exchange` — RFC 8693

    The deprecated `password` and `implicit` grants are intentionally
    omitted (per OAuth 2.1).

    Client authentication: `client_secret_basic` (HTTP Basic) and mTLS
    (RFC 8705) appear as security schemes; the form-body methods —
    `client_secret_post` and the RFC 7523 `client_assertion` variants
    (`private_key_jwt` / `client_secret_jwt`) — travel inside the
    request body itself and are modeled by `ClientAuthFields`. Public
    clients send no client credential (the empty security option) and
    rely on PKCE.
  externalDocs:
    description: RFC 6749 §3.2
    url: https://datatracker.ietf.org/doc/html/rfc6749#section-3.2
  parameters:
  - $ref: ../components/parameters.yaml#/DPoPHeader
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/token-requests.yaml#/TokenRequest
  responses:
    '200':
      description: Access token issued
      headers:
        Cache-Control:
          $ref: ../components/headers.yaml#/CacheControlNoStore
        Pragma:
          $ref: ../components/headers.yaml#/PragmaNoCache
        DPoP-Nonce:
          $ref: ../components/headers.yaml#/DPoPNonce
      content:
        application/json:
          schema:
            $ref: ../components/schemas/token-responses.yaml#/TokenResponse
    '400':
      $ref: ../components/responses.yaml#/OAuthErrorWithDPoPNonce
    '401':
      $ref: ../components/responses.yaml#/ClientAuthError
  security:
  - clientSecretBasic: []
  - mtls: []
  - {}
