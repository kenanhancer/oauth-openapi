post:
  tags:
  - Token Lifecycle
  operationId: revoke
  summary: Token revocation
  description: |
    Revokes an access or refresh token before its natural expiry. Per
    RFC 7009 §2.1, when a refresh token is revoked the AS SHOULD also
    invalidate all access tokens issued under the same authorization
    grant; when an access token is revoked, the AS MAY also revoke the
    underlying refresh token.
    A successful revocation always returns HTTP 200 with an empty body
    — even when the token is unknown to the server.
  externalDocs:
    description: RFC 7009 §2
    url: https://datatracker.ietf.org/doc/html/rfc7009#section-2
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/introspection.yaml#/RevocationRequest
  responses:
    '200':
      description: Revocation accepted (returned even if the token was unknown).
      headers:
        Cache-Control:
          $ref: ../components/headers.yaml#/CacheControlNoStore
        Pragma:
          $ref: ../components/headers.yaml#/PragmaNoCache
    '400':
      $ref: ../components/responses.yaml#/OAuthError
    '401':
      $ref: ../components/responses.yaml#/ClientAuthError
  security:
  - clientSecretBasic: []
  - mtls: []
  - {}
