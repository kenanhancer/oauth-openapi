openapi: 3.1.0
info:
  title: OAuth 2.0 + OpenID Connect — RFC-Canonical OpenAPI Specification
  version: 1.0.0
  summary: |
    Vendor-agnostic OpenAPI 3.1 description of the OAuth 2.0 / OpenID Connect
    authorization-server protocol surface, derived directly from IETF RFCs and the
    OpenID Foundation specifications. Defaults follow OAuth 2.1.
  description: |
    # OAuth 2.0 + OpenID Connect — RFC-Canonical OpenAPI

    This specification describes the HTTP surface of an OAuth 2.0 / OpenID Connect
    authorization server in a vendor-neutral way. Every endpoint and field is
    cross-referenced to the source RFC or specification section.

    ## Covered specifications

    | Spec | Year | Subject |
    |---|---|---|
    | RFC 6749 | 2012 | OAuth 2.0 Authorization Framework |
    | RFC 6750 | 2012 | Bearer Token Usage |
    | RFC 7009 | 2013 | Token Revocation |
    | RFC 7517 | 2015 | JSON Web Key (JWK / JWKS) |
    | RFC 7519 | 2015 | JSON Web Token (JWT) |
    | RFC 7636 | 2015 | PKCE — Proof Key for Code Exchange |
    | RFC 7662 | 2015 | Token Introspection |
    | RFC 8414 | 2018 | Authorization Server Metadata |
    | RFC 8628 | 2019 | Device Authorization Grant |
    | RFC 8693 | 2020 | Token Exchange |
    | RFC 9068 | 2021 | JWT Profile for OAuth 2.0 Access Tokens |
    | RFC 9126 | 2021 | Pushed Authorization Requests (PAR) |
    | RFC 9396 | 2023 | Rich Authorization Requests (RAR) |
    | RFC 9449 | 2023 | DPoP — Demonstrating Proof of Possession |
    | RFC 9700 | 2025 | OAuth 2.0 Security Best Current Practice |
    | OAuth 2.1 (draft) | ongoing | Consolidated modern best practices |
    | OIDC Core 1.0 | 2014 | OpenID Connect identity layer |
    | OIDC Discovery 1.0 | 2014 | `.well-known/openid-configuration` schema |

    ## Modeling notes

    - **`/authorize` is browser-driven.** OpenAPI cannot precisely model 302 redirects
      to a client-controlled `redirect_uri` followed by HTML consent. The parameters
      and redirect semantics are described, but the response body is an approximation.
      The exact behavior is in RFC 6749 §4.1.2.

    - **`/token` uses a `grant_type` discriminator.** Per RFC 6749 §3.2, all grants
      POST to one endpoint and are dispatched by the `grant_type` form field. This
      spec uses `oneOf` + discriminator. Tooling without discriminator support may
      need to flatten the schema.

    - **OAuth 2.1 defaults are applied.** PKCE is mandatory for all public clients;
      Implicit (`response_type=token`) and Resource Owner Password (`grant_type=password`)
      grants are excluded as they are deprecated by OAuth 2.1.

    - **DPoP is supported via a request header.** The `DPoP` header is documented on
      relevant endpoints; the proof JWT itself is not modeled as a body schema.

  contact:
    name: oauth-openapi project
    url: https://github.com/kenanhancer/oauth-openapi
  license:
    name: CC-BY-4.0
    url: https://creativecommons.org/licenses/by/4.0/

externalDocs:
  description: OAuth 2.1 working draft (the primary modern reference)
  url: https://datatracker.ietf.org/doc/draft-ietf-oauth-v2-1/

servers:
  - url: 'https://{issuer}'
    description: Authorization server, identified by its issuer URL
    variables:
      issuer:
        default: as.example.com
        description: |
          Hostname of the OAuth 2.0 / OIDC issuer. The exact path layout under this
          host is vendor-specific; use the discovery endpoints to obtain canonical
          URLs at runtime.

tags:
  - name: Core
    description: RFC 6749 endpoints — authorize and token
  - name: Token Lifecycle
    description: RFC 7009 (revoke) + RFC 7662 (introspect)
  - name: Device Flow
    description: RFC 8628
  - name: PAR
    description: RFC 9126 — Pushed Authorization Requests
  - name: OpenID Connect
    description: OIDC Core — UserInfo
  - name: Discovery
    description: 'RFC 8414 + OIDC Discovery — `.well-known` metadata'
  - name: JWKS
    description: RFC 7517 — JSON Web Key Set

paths:

  # =========================================================================
  # /authorize — RFC 6749 §3.1 / §4.1.1
  # =========================================================================
  /authorize:
    get:
      tags: [Core]
      operationId: authorize
      summary: Authorization endpoint
      description: |
        Initiates a browser-driven authorization request. The user-agent is
        navigated to this URL; the server authenticates the resource owner and
        obtains consent, then redirects the user-agent back to `redirect_uri`
        with a `code` (success) or an `error`.

        Under OAuth 2.1 only `response_type=code` is permitted (Implicit is
        deprecated). PKCE (`code_challenge`) is mandatory.
      externalDocs:
        description: RFC 6749 §4.1.1, OIDC Core §3.1.2.1
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-4.1.1
      parameters:
        - $ref: '#/components/parameters/ResponseType'
        - $ref: '#/components/parameters/ClientId'
        - $ref: '#/components/parameters/RedirectUri'
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/State'
        - $ref: '#/components/parameters/CodeChallenge'
        - $ref: '#/components/parameters/CodeChallengeMethod'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Prompt'
        - $ref: '#/components/parameters/LoginHint'
        - $ref: '#/components/parameters/MaxAge'
        - $ref: '#/components/parameters/AcrValues'
        - $ref: '#/components/parameters/ResponseMode'
        - $ref: '#/components/parameters/RequestUri'
        - $ref: '#/components/parameters/AuthorizationDetails'
        - $ref: '#/components/parameters/Resource'
      responses:
        '302':
          description: |
            User-agent redirect back to `redirect_uri`. On success, the
            `Location` header carries `code` and `state`. On failure it carries
            `error`, `error_description`, and `state`.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
                examples:
                  - 'https://client.example.com/cb?code=SplxlOBeZQQYbYS6WxSbIA&state=xyz'
                  - 'https://client.example.com/cb?error=access_denied&state=xyz'
        '200':
          description: HTML consent or authentication page (intermediate state)
          content:
            text/html:
              schema:
                type: string

  # =========================================================================
  # /token — RFC 6749 §3.2
  # =========================================================================
  /token:
    post:
      tags: [Core]
      operationId: token
      summary: Token endpoint (all grants)
      description: |
        Issues access tokens. The `grant_type` form field selects the grant. All
        grants supported by OAuth 2.1 are modeled here:

        - `authorization_code` — RFC 6749 §4.1.3 (with PKCE per RFC 7636)
        - `client_credentials` — RFC 6749 §4.4
        - `refresh_token` — RFC 6749 §6
        - `urn:ietf:params:oauth:grant-type:device_code` — RFC 8628 §3.4
        - `urn:ietf:params:oauth:grant-type:jwt-bearer` — RFC 7523
        - `urn:ietf:params:oauth:grant-type:token-exchange` — RFC 8693

        The deprecated `password` and `implicit` grants are intentionally
        omitted (per OAuth 2.1).
      externalDocs:
        description: RFC 6749 §3.2
        url: https://datatracker.ietf.org/doc/html/rfc6749#section-3.2
      parameters:
        - $ref: '#/components/parameters/DPoPHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Access token issued
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
            Pragma:
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - clientSecretBasic: []
        - clientSecretPost: []
        - clientAssertion: []
        - none: []

  # =========================================================================
  # /revoke — RFC 7009
  # =========================================================================
  /revoke:
    post:
      tags: [Token Lifecycle]
      operationId: revoke
      summary: Token revocation
      description: |
        Revokes an access or refresh token before its natural expiry. The
        server SHOULD also revoke any refresh tokens issued from the revoked
        token's authorization grant. A successful revocation always returns
        HTTP 200 — the body is empty.
      externalDocs:
        description: RFC 7009 §2
        url: https://datatracker.ietf.org/doc/html/rfc7009#section-2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevocationRequest'
      responses:
        '200':
          description: Revocation accepted (returned even if the token was unknown)
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - clientSecretBasic: []
        - clientSecretPost: []
        - clientAssertion: []

  # =========================================================================
  # /introspect — RFC 7662
  # =========================================================================
  /introspect:
    post:
      tags: [Token Lifecycle]
      operationId: introspect
      summary: Token introspection
      description: |
        A protected resource queries the authorization server about the
        meta-information of a token (active state, scopes, expiry, subject).
        Critical for opaque (non-JWT) tokens. JWT tokens can usually be
        validated locally by verifying the signature against the JWKS.
      externalDocs:
        description: RFC 7662 §2
        url: https://datatracker.ietf.org/doc/html/rfc7662#section-2
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IntrospectionRequest'
      responses:
        '200':
          description: Introspection result (always 200, even for inactive tokens)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - clientSecretBasic: []
        - clientSecretPost: []
        - clientAssertion: []

  # =========================================================================
  # /device_authorization — RFC 8628
  # =========================================================================
  /device_authorization:
    post:
      tags: [Device Flow]
      operationId: deviceAuthorization
      summary: Device Authorization Endpoint (RFC 8628)
      description: |
        Initiates the Device Authorization Grant. The client receives a
        `device_code` and `user_code`; the user is instructed to visit
        `verification_uri` on a second device and enter the `user_code`. The
        client then polls `/token` with `grant_type=urn:ietf:params:oauth:grant-type:device_code`
        until the user authorizes (or until `expires_in` elapses).
      externalDocs:
        description: RFC 8628 §3.1
        url: https://datatracker.ietf.org/doc/html/rfc8628#section-3.1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceAuthorizationRequest'
      responses:
        '200':
          description: Device authorization issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - clientSecretBasic: []
        - clientSecretPost: []
        - none: []

  # =========================================================================
  # /par — RFC 9126
  # =========================================================================
  /par:
    post:
      tags: [PAR]
      operationId: pushedAuthorizationRequest
      summary: Pushed Authorization Request (RFC 9126)
      description: |
        Pushes the authorization request parameters to the server before the
        user-agent redirect. The server returns a short-lived `request_uri`
        that the client then passes (instead of the full request) to
        `/authorize`. This avoids leaking parameters via browser history,
        keeps URLs short, and enables integrity protection.
      externalDocs:
        description: RFC 9126 §2
        url: https://datatracker.ietf.org/doc/html/rfc9126#section-2
      parameters:
        - $ref: '#/components/parameters/DPoPHeader'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PARRequest'
      responses:
        '201':
          description: Pushed authorization request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PARResponse'
        '400':
          $ref: '#/components/responses/OAuthError'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - clientSecretBasic: []
        - clientSecretPost: []
        - clientAssertion: []

  # =========================================================================
  # /userinfo — OIDC Core §5.3
  # =========================================================================
  /userinfo:
    get:
      tags: [OpenID Connect]
      operationId: userinfoGet
      summary: UserInfo endpoint (GET, OIDC)
      description: |
        Returns claims about the authenticated end-user. Requires a valid
        OIDC access token in the `Authorization` header (or DPoP).
      externalDocs:
        description: OIDC Core §5.3
        url: https://openid.net/specs/openid-connect-core-1_0.html#UserInfo
      responses:
        '200':
          description: UserInfo claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
            application/jwt:
              schema:
                type: string
                description: Signed/encrypted JWT containing the claims
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - bearerAuth: []
        - dpop: []
    post:
      tags: [OpenID Connect]
      operationId: userinfoPost
      summary: UserInfo endpoint (POST, OIDC)
      description: Same semantics as GET; some clients prefer POST per OIDC Core §5.3.1.
      externalDocs:
        description: OIDC Core §5.3.1
        url: https://openid.net/specs/openid-connect-core-1_0.html#UserInfoRequest
      responses:
        '200':
          description: UserInfo claims
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          $ref: '#/components/responses/OAuthError'
      security:
        - bearerAuth: []
        - dpop: []

  # =========================================================================
  # /jwks — RFC 7517
  # =========================================================================
  /jwks:
    get:
      tags: [JWKS]
      operationId: jwks
      summary: JSON Web Key Set
      description: |
        Returns the public keys used by this issuer to sign tokens (and
        encrypt requests, when applicable). Clients fetch this to verify
        JWT signatures locally. The actual path is announced by
        `jwks_uri` in the discovery document.
      externalDocs:
        description: RFC 7517 §5
        url: https://datatracker.ietf.org/doc/html/rfc7517#section-5
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKS'

  # =========================================================================
  # Discovery — OIDC Discovery 1.0
  # =========================================================================
  /.well-known/openid-configuration:
    get:
      tags: [Discovery]
      operationId: openidConfiguration
      summary: OIDC discovery metadata
      description: |
        Standardized discovery endpoint published by every OpenID Connect
        provider. The response describes all endpoints, supported flows,
        scopes, claims, signing algorithms, and capabilities.

        This is the **only path that is truly standardized across OIDC
        providers** — all other endpoint URLs are vendor-defined and must be
        read from this document.
      externalDocs:
        description: OIDC Discovery 1.0 §3
        url: https://openid.net/specs/openid-connect-discovery-1_0.html#ProviderMetadata
      responses:
        '200':
          description: Provider metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'

  # =========================================================================
  # Discovery — RFC 8414 (OAuth without OIDC)
  # =========================================================================
  /.well-known/oauth-authorization-server:
    get:
      tags: [Discovery]
      operationId: authorizationServerMetadata
      summary: OAuth 2.0 authorization-server metadata (RFC 8414)
      description: |
        Equivalent to the OIDC discovery document for plain OAuth 2.0
        servers that do not implement OpenID Connect. The response shape
        is a strict subset of the OIDC discovery document.
      externalDocs:
        description: RFC 8414 §3
        url: https://datatracker.ietf.org/doc/html/rfc8414#section-3
      responses:
        '200':
          description: Authorization server metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryDocument'

# =============================================================================
# Components
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Reusable parameters (mostly for /authorize)
  # ---------------------------------------------------------------------------
  parameters:
    ResponseType:
      name: response_type
      in: query
      required: true
      description: |
        OAuth 2.1 permits only `code`. OIDC adds `id_token`, `code id_token`,
        `code token`, `code id_token token` for hybrid flows.
      schema:
        type: string
        enum:
          - code
          - id_token
          - 'code id_token'
          - 'code token'
          - 'code id_token token'

    ClientId:
      name: client_id
      in: query
      required: true
      description: The client identifier issued at registration time (RFC 6749 §2.2).
      schema:
        type: string

    RedirectUri:
      name: redirect_uri
      in: query
      required: false
      description: |
        Where the user-agent is redirected after authorization. Must match a
        URI pre-registered for the client. Required when more than one is
        registered.
      schema:
        type: string
        format: uri

    Scope:
      name: scope
      in: query
      required: false
      description: |
        Space-delimited list of scopes. For OIDC, MUST include `openid` to
        request an ID token. Standard OIDC scopes: `profile`, `email`,
        `address`, `phone`, `offline_access`.
      schema:
        type: string
        examples:
          - openid
          - 'openid profile email'
          - 'openid offline_access'

    State:
      name: state
      in: query
      required: false
      description: |
        Opaque value used by the client to maintain state and prevent CSRF.
        The server returns it unchanged in the redirect. RFC 6749 §10.12.
      schema:
        type: string

    CodeChallenge:
      name: code_challenge
      in: query
      required: true
      description: |
        PKCE challenge — `BASE64URL(SHA256(code_verifier))` when method is
        `S256`. **Mandatory in OAuth 2.1 for all clients.** RFC 7636 §4.3.
      schema:
        type: string

    CodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      description: |
        Always `S256` per OAuth 2.1. The plain method exists for legacy
        compatibility only and SHOULD NOT be used.
      schema:
        type: string
        enum: [S256, plain]
        default: S256

    Nonce:
      name: nonce
      in: query
      required: false
      description: |
        OIDC: opaque random value bound to the ID token's `nonce` claim,
        for replay protection. OIDC Core §3.1.2.1.
      schema:
        type: string

    Prompt:
      name: prompt
      in: query
      required: false
      description: |
        OIDC: how the auth server should prompt the user. Space-delimited.
      schema:
        type: string
        enum:
          - none
          - login
          - consent
          - select_account

    LoginHint:
      name: login_hint
      in: query
      required: false
      description: 'OIDC: hint to the auth server about the login identifier (e.g. e-mail).'
      schema:
        type: string

    MaxAge:
      name: max_age
      in: query
      required: false
      description: 'OIDC: maximum allowed elapsed time since last authentication, in seconds.'
      schema:
        type: integer
        minimum: 0

    AcrValues:
      name: acr_values
      in: query
      required: false
      description: 'OIDC: requested Authentication Context Class Reference values, space-separated.'
      schema:
        type: string

    ResponseMode:
      name: response_mode
      in: query
      required: false
      description: |
        Mechanism for delivering the authorization response. `query`,
        `fragment`, `form_post` (OAuth 2.0 Form Post Response Mode).
      schema:
        type: string
        enum: [query, fragment, form_post]

    RequestUri:
      name: request_uri
      in: query
      required: false
      description: |
        Reference to a request previously submitted via PAR (RFC 9126 §4).
        When present, takes precedence over individual query parameters.
      schema:
        type: string
        format: uri

    AuthorizationDetails:
      name: authorization_details
      in: query
      required: false
      description: |
        Rich Authorization Requests (RAR) — JSON-encoded array of
        authorization detail objects. RFC 9396.
      schema:
        type: string

    Resource:
      name: resource
      in: query
      required: false
      description: |
        Indicator of the protected resource for which authorization is being
        requested. RFC 8707.
      schema:
        type: string
        format: uri

    DPoPHeader:
      name: DPoP
      in: header
      required: false
      description: |
        DPoP proof JWT (RFC 9449). Present when the client uses
        sender-constrained access tokens. The JWT proves possession of the
        private key bound to the access token.
      schema:
        type: string
        description: A JWT in compact serialization

  # ---------------------------------------------------------------------------
  # Reusable responses
  # ---------------------------------------------------------------------------
  responses:
    OAuthError:
      description: Standard OAuth 2.0 error response (RFC 6749 §5.2)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # -----------------------------------------------------------------
    # Token request — discriminated by grant_type (RFC 6749 §3.2)
    # -----------------------------------------------------------------
    TokenRequest:
      description: |
        Discriminated union of all supported token-request bodies, keyed by
        `grant_type` per RFC 6749 §3.2.
      oneOf:
        - $ref: '#/components/schemas/AuthorizationCodeTokenRequest'
        - $ref: '#/components/schemas/ClientCredentialsTokenRequest'
        - $ref: '#/components/schemas/RefreshTokenRequest'
        - $ref: '#/components/schemas/DeviceCodeTokenRequest'
        - $ref: '#/components/schemas/JWTBearerTokenRequest'
        - $ref: '#/components/schemas/TokenExchangeRequest'
      discriminator:
        propertyName: grant_type
        mapping:
          authorization_code: '#/components/schemas/AuthorizationCodeTokenRequest'
          client_credentials: '#/components/schemas/ClientCredentialsTokenRequest'
          refresh_token: '#/components/schemas/RefreshTokenRequest'
          'urn:ietf:params:oauth:grant-type:device_code': '#/components/schemas/DeviceCodeTokenRequest'
          'urn:ietf:params:oauth:grant-type:jwt-bearer': '#/components/schemas/JWTBearerTokenRequest'
          'urn:ietf:params:oauth:grant-type:token-exchange': '#/components/schemas/TokenExchangeRequest'

    AuthorizationCodeTokenRequest:
      description: RFC 6749 §4.1.3 with PKCE per RFC 7636 §4.5
      type: object
      required: [grant_type, code, redirect_uri, code_verifier]
      properties:
        grant_type:
          type: string
          const: authorization_code
        code:
          type: string
          description: The authorization code received from `/authorize`.
        redirect_uri:
          type: string
          format: uri
          description: Must match the `redirect_uri` used at `/authorize`.
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          description: PKCE verifier (RFC 7636 §4.1).
        client_id:
          type: string
          description: REQUIRED if the client is not authenticating with the server (e.g. public client).

    ClientCredentialsTokenRequest:
      description: RFC 6749 §4.4
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          const: client_credentials
        scope:
          type: string
          description: Space-delimited list of requested scopes.
        resource:
          type: string
          format: uri
          description: Resource indicator (RFC 8707).
        audience:
          type: string

    RefreshTokenRequest:
      description: RFC 6749 §6
      type: object
      required: [grant_type, refresh_token]
      properties:
        grant_type:
          type: string
          const: refresh_token
        refresh_token:
          type: string
        scope:
          type: string
          description: |
            Optional. If present, MUST be no broader than the original
            authorization grant.

    DeviceCodeTokenRequest:
      description: RFC 8628 §3.4
      type: object
      required: [grant_type, device_code, client_id]
      properties:
        grant_type:
          type: string
          const: 'urn:ietf:params:oauth:grant-type:device_code'
        device_code:
          type: string
          description: The `device_code` from `/device_authorization`.
        client_id:
          type: string

    JWTBearerTokenRequest:
      description: RFC 7523 §2.1
      type: object
      required: [grant_type, assertion]
      properties:
        grant_type:
          type: string
          const: 'urn:ietf:params:oauth:grant-type:jwt-bearer'
        assertion:
          type: string
          description: A signed JWT bearer assertion.
        scope:
          type: string

    TokenExchangeRequest:
      description: RFC 8693 §2.1
      type: object
      required: [grant_type, subject_token, subject_token_type]
      properties:
        grant_type:
          type: string
          const: 'urn:ietf:params:oauth:grant-type:token-exchange'
        subject_token:
          type: string
        subject_token_type:
          type: string
          enum:
            - 'urn:ietf:params:oauth:token-type:access_token'
            - 'urn:ietf:params:oauth:token-type:refresh_token'
            - 'urn:ietf:params:oauth:token-type:id_token'
            - 'urn:ietf:params:oauth:token-type:saml1'
            - 'urn:ietf:params:oauth:token-type:saml2'
            - 'urn:ietf:params:oauth:token-type:jwt'
        actor_token:
          type: string
        actor_token_type:
          type: string
        requested_token_type:
          type: string
        audience:
          type: string
        resource:
          type: string
          format: uri
        scope:
          type: string

    # -----------------------------------------------------------------
    # Token response — RFC 6749 §5.1 + OIDC additions
    # -----------------------------------------------------------------
    TokenResponse:
      description: Successful token response — RFC 6749 §5.1, OIDC adds `id_token`.
      type: object
      required: [access_token, token_type]
      properties:
        access_token:
          type: string
          description: The access token issued.
          examples: [SlAV32hkKG]
        token_type:
          type: string
          description: 'Typically `Bearer` (RFC 6750) or `DPoP` (RFC 9449).'
          examples: [Bearer, DPoP]
        expires_in:
          type: integer
          description: Lifetime in seconds.
          examples: [3600]
        refresh_token:
          type: string
          description: Optional refresh token (RFC 6749 §5.1).
        scope:
          type: string
          description: Granted scope, if different from requested.
        id_token:
          type: string
          description: 'OIDC: signed JWT identifying the authenticated user.'
        authorization_details:
          type: array
          description: 'RAR (RFC 9396): granted authorization detail objects.'
          items:
            type: object

    # -----------------------------------------------------------------
    # Error response — RFC 6749 §5.2
    # -----------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Single ASCII error code.
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - access_denied
            - unsupported_response_type
            - server_error
            - temporarily_unavailable
            - invalid_token            # RFC 6750
            - insufficient_scope       # RFC 6750
            - authorization_pending    # RFC 8628
            - slow_down                # RFC 8628
            - expired_token            # RFC 8628
            - invalid_dpop_proof       # RFC 9449
            - use_dpop_nonce           # RFC 9449
            - invalid_target           # RFC 8707
        error_description:
          type: string
          description: Human-readable description for the developer.
        error_uri:
          type: string
          format: uri
          description: URI to a page describing the error.
        state:
          type: string
          description: Echoed `state` from the request (when applicable).

    # -----------------------------------------------------------------
    # Device flow — RFC 8628
    # -----------------------------------------------------------------
    DeviceAuthorizationRequest:
      description: RFC 8628 §3.1
      type: object
      required: [client_id]
      properties:
        client_id:
          type: string
        scope:
          type: string

    DeviceAuthorizationResponse:
      description: RFC 8628 §3.2
      type: object
      required: [device_code, user_code, verification_uri, expires_in]
      properties:
        device_code:
          type: string
          description: Long opaque device verification code (kept secret by the client).
        user_code:
          type: string
          description: Short, human-typeable code shown to the user.
          examples: ['WDJB-MJHT', '26FB-FA97']
        verification_uri:
          type: string
          format: uri
          description: End-user verification URI on the authorization server.
        verification_uri_complete:
          type: string
          format: uri
          description: 'Optional: URI with `user_code` already embedded (for QR codes).'
        expires_in:
          type: integer
          description: Lifetime in seconds of `device_code` and `user_code`.
        interval:
          type: integer
          description: Minimum polling interval in seconds (default 5).
          default: 5

    # -----------------------------------------------------------------
    # PAR — RFC 9126
    # -----------------------------------------------------------------
    PARRequest:
      description: |
        Same parameters as `/authorize` (response_type, client_id,
        redirect_uri, scope, code_challenge, etc.) but POSTed as a body.
      type: object
      required: [client_id, response_type]
      properties:
        response_type:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        scope:
          type: string
        state:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        nonce:
          type: string
        request:
          type: string
          description: Optional signed JWT request object (JAR, RFC 9101).
      additionalProperties: true

    PARResponse:
      type: object
      required: [request_uri, expires_in]
      properties:
        request_uri:
          type: string
          format: uri
          description: |
            Reference URI to be passed to `/authorize` in the
            `request_uri` query parameter.
          examples:
            - 'urn:ietf:params:oauth:request_uri:6esc_11ACC5bwc014ltc14eY22c'
        expires_in:
          type: integer
          description: Lifetime in seconds of the `request_uri`.

    # -----------------------------------------------------------------
    # Introspection — RFC 7662
    # -----------------------------------------------------------------
    IntrospectionRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
          description: Hint to the server about which token type is being introspected.

    IntrospectionResponse:
      description: RFC 7662 §2.2
      type: object
      required: [active]
      properties:
        active:
          type: boolean
          description: |
            REQUIRED. Whether the token is currently valid. If `false`, all
            other fields MAY be omitted.
        scope:
          type: string
        client_id:
          type: string
        username:
          type: string
        token_type:
          type: string
        exp:
          type: integer
          description: Expiration time (seconds since epoch).
        iat:
          type: integer
          description: Issued at (seconds since epoch).
        nbf:
          type: integer
        sub:
          type: string
        aud:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        iss:
          type: string
        jti:
          type: string

    # -----------------------------------------------------------------
    # Revocation — RFC 7009
    # -----------------------------------------------------------------
    RevocationRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]

    # -----------------------------------------------------------------
    # JWKS — RFC 7517
    # -----------------------------------------------------------------
    JWKS:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/JWK'

    JWK:
      type: object
      required: [kty]
      description: |
        Selected JWK fields. The full schema depends on `kty` (key type) —
        `RSA`, `EC`, `OKP`, `oct`. See RFC 7517 §4 and RFC 7518.
      properties:
        kty:
          type: string
          enum: [RSA, EC, OKP, oct]
        use:
          type: string
          enum: [sig, enc]
        key_ops:
          type: array
          items:
            type: string
        alg:
          type: string
          examples: [RS256, ES256, EdDSA]
        kid:
          type: string
        x5u:
          type: string
          format: uri
        x5c:
          type: array
          items:
            type: string
        x5t:
          type: string
        'x5t#S256':
          type: string
        n:
          type: string
          description: 'RSA modulus (base64url).'
        e:
          type: string
          description: 'RSA exponent (base64url).'
        crv:
          type: string
          description: 'EC/OKP curve (e.g. P-256, Ed25519).'
        x:
          type: string
        y:
          type: string

    # -----------------------------------------------------------------
    # Discovery document — OIDC Discovery 1.0 + RFC 8414
    # -----------------------------------------------------------------
    DiscoveryDocument:
      description: |
        Provider metadata. The OIDC Discovery superset includes additional
        `*_supported` fields; RFC 8414 (OAuth-only) defines the same shape
        with fewer required fields.
      type: object
      required: [issuer, authorization_endpoint, token_endpoint, response_types_supported]
      properties:
        issuer:
          type: string
          format: uri
          description: Canonical issuer URL — MUST equal the host the document was fetched from.
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        userinfo_endpoint:
          type: string
          format: uri
          description: 'OIDC: required if the provider supports it.'
        jwks_uri:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
          description: Dynamic Client Registration endpoint (RFC 7591).
        introspection_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        device_authorization_endpoint:
          type: string
          format: uri
        pushed_authorization_request_endpoint:
          type: string
          format: uri
        end_session_endpoint:
          type: string
          format: uri
          description: 'OIDC RP-Initiated Logout endpoint.'
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
            enum:
              - none
              - client_secret_basic
              - client_secret_post
              - client_secret_jwt
              - private_key_jwt
              - tls_client_auth
              - self_signed_tls_client_auth
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
            enum: [public, pairwise]
        claims_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
            enum: [S256, plain]
        require_pushed_authorization_requests:
          type: boolean
          description: 'PAR (RFC 9126): if true, `/authorize` MUST be reached via PAR.'
        dpop_signing_alg_values_supported:
          type: array
          items:
            type: string
          description: 'DPoP (RFC 9449): supported signing algorithms.'
        authorization_details_types_supported:
          type: array
          items:
            type: string
          description: 'RAR (RFC 9396): supported authorization detail types.'

    # -----------------------------------------------------------------
    # UserInfo — OIDC Core §5
    # -----------------------------------------------------------------
    UserInfoResponse:
      description: |
        OIDC standard claims (§5.1) returned by `/userinfo`. The `sub` claim
        is REQUIRED; all others are optional and depend on requested scopes.
      type: object
      required: [sub]
      properties:
        sub:
          type: string
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        middle_name:
          type: string
        nickname:
          type: string
        preferred_username:
          type: string
        profile:
          type: string
          format: uri
        picture:
          type: string
          format: uri
        website:
          type: string
          format: uri
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        gender:
          type: string
        birthdate:
          type: string
          format: date
        zoneinfo:
          type: string
        locale:
          type: string
        phone_number:
          type: string
        phone_number_verified:
          type: boolean
        address:
          type: object
          properties:
            formatted:
              type: string
            street_address:
              type: string
            locality:
              type: string
            region:
              type: string
            postal_code:
              type: string
            country:
              type: string
        updated_at:
          type: integer

  # ---------------------------------------------------------------------------
  # Security schemes
  # ---------------------------------------------------------------------------
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'OAuth 2.0 Bearer Token in the Authorization header (RFC 6750).'

    dpop:
      type: http
      scheme: dpop
      description: |
        DPoP-bound access token. Both an `Authorization: DPoP <token>` header
        AND a `DPoP: <proof-jwt>` header are required (RFC 9449).

    clientSecretBasic:
      type: http
      scheme: basic
      description: 'Client authentication via HTTP Basic with `client_id:client_secret` (RFC 6749 §2.3.1).'

    clientSecretPost:
      type: apiKey
      in: header
      name: X-OAuth-Client-Secret-Post
      description: |
        Client authentication via `client_id` and `client_secret` in the
        request body (RFC 6749 §2.3.1). Marked apiKey/header here only because
        OpenAPI lacks a body-credentials scheme; in practice these are
        included in the form body.

    clientAssertion:
      type: apiKey
      in: header
      name: X-OAuth-Client-Assertion
      description: |
        `client_assertion` + `client_assertion_type` form fields (RFC 7521).
        For `private_key_jwt` and `client_secret_jwt` authentication. Modeled
        as apiKey because OpenAPI cannot natively express body-form
        authentication.

    none:
      type: apiKey
      in: header
      name: X-No-Authentication
      description: |
        Public client — no client authentication. Permitted for native and
        SPA clients per OAuth 2.1, provided PKCE is used.

    oauth2:
      type: oauth2
      description: |
        OAuth 2.0 / OIDC flows. Use this scheme on protected resources to
        declare which scopes a caller must hold.
      flows:
        authorizationCode:
          authorizationUrl: 'https://as.example.com/authorize'
          tokenUrl: 'https://as.example.com/token'
          refreshUrl: 'https://as.example.com/token'
          scopes:
            openid: OIDC — issue an ID token
            profile: OIDC — basic profile claims
            email: OIDC — e-mail and verification
            offline_access: Issue a refresh token
        clientCredentials:
          tokenUrl: 'https://as.example.com/token'
          refreshUrl: 'https://as.example.com/token'
          scopes: {}
